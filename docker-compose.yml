services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ucs
      POSTGRES_PASSWORD: ucs
      POSTGRES_DB: ucs_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucs -d ucs_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
