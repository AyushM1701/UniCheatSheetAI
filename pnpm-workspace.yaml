packages:
  - "apps/*"
  - "packages/*"
  - "packages/providers/llm"
overrides:
  '@huggingface/transformers>sharp': 0.35.4
  '@prisma/config>deepmerge-ts': 8.0.0
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "onnxruntime-node"
  - "prisma"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  onnxruntime-node: true
  prisma: true
  protobufjs: false
  sharp: false
